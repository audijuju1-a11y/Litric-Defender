[package]
name = "litric-service"
description = "Litric Defender local API backend: scan jobs, quarantine, RansomShield ingestion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "litric_service"
path = "src/lib.rs"

[[bin]]
name = "litricd"
path = "src/main.rs"

[dependencies]
litric-core = { path = "../litric-core" }
litric-safeos = { path = "../litric-safeos" }
litric-monitor = { path = "../litric-monitor" }
litric-pipeline = { path = "../litric-pipeline" }
processgate = { path = "../processgate" }
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
tiny_http = "0.12"
clap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
