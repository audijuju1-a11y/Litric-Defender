[package]
name = "litric-wintrust"
description = "Authenticode signature verification through the documented Windows WinVerifyTrust API (Windows only; other platforms report Unsupported)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
