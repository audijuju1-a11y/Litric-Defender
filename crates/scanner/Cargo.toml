[package]
name = "scanner"
version = "0.1.0"
edition = "2021"
description = "Litric file scanner: honest outcomes, bounded resources, signature + hash matching"
license = "LicenseRef-Proprietary"

[dependencies]
sigdb = { path = "../sigdb" }
quarantine = { path = "../quarantine" }
peanalysis = { path = "../peanalysis" }
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
aho-corasick = "1"

[dev-dependencies]
ed25519-dalek = "2"
clamav-import = { path = "../clamav-import" }

[[bin]]
name = "litric-scan"
path = "src/main.rs"
